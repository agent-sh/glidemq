name: Check upstream drift

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run drift check
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUTPUT=$(./scripts/check-upstream-drift.sh)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo 'report<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update drift issue
        if: steps.drift.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream glide-mq skills drift detected"
          BODY=$(cat <<EOF
          Automated drift detection found that vendored skills are behind \`avifenesh/glide-mq\` HEAD.

          \`\`\`
          ${{ steps.drift.outputs.report }}
          \`\`\`

          Run \`./scripts/sync-upstream.sh\` to update.
          EOF
          )
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "upstream-sync"
          fi
