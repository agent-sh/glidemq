name: Check upstream drift

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run drift check
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUTPUT=$(./scripts/check-upstream-drift.sh)
          STATUS=$?
          echo "$OUTPUT"
          {
            echo 'report<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # 1 is drift (handled by the next step); anything else nonzero is a
          # failed check and should show as a failed run.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 1 ]; then
            exit "$STATUS"
          fi
          exit 0

      - name: Open or update drift issue
        if: steps.drift.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_REPORT: ${{ steps.drift.outputs.report }}
        run: |
          set -euo pipefail
          TITLE="Upstream glide-mq skills drift detected"
          # The report reaches the script through an env var, not an inline
          # expression, so nothing in the upstream-sourced text (commit
          # messages, version strings) can break out and run as shell. Keep
          # expression syntax out of these comments: Actions parses it even
          # here, and an empty expression made this workflow invalid.
          BODY=$(printf 'Automated drift detection found that vendored skills are behind `avifenesh/glide-mq` HEAD.\n\n```\n%s\n```\n\nRun `./scripts/sync-upstream.sh` to update.\n' "$DRIFT_REPORT")
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
          else
            gh label create upstream-sync --color 0e8a16 --description "Vendored skills behind upstream" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label "upstream-sync"
          fi
